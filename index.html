<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Drone Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* A game hangar: the 3D stage fills the screen; category rail left, parts locker right, stat bars and system check at the bottom. Single dark look by design (a hangar at night). */
:root{
  --bg:#070D14; --glass:rgba(10,20,31,.84); --glass2:rgba(18,33,49,.92); --line:rgba(140,175,210,.18); --line2:rgba(140,175,210,.36);
  --fg:#EAF0F5; --muted:#8FA3B8; --amber:#F2A541; --amber2:#FFC777; --teal:#5FD4C4; --ok:#6BD99A; --warn:#F2C14E; --bad:#FF6B5E;
  --disp:'Chakra Petch','Segoe UI',Arial,sans-serif; --body:'IBM Plex Sans','Segoe UI',Arial,sans-serif; --mono:'JetBrains Mono',Consolas,'Courier New',monospace;
  --cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{position:relative;height:100%;overflow:hidden}
.stage{position:absolute;inset:0}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.panel{background:var(--glass);border:1px solid var(--line);clip-path:var(--cut);backdrop-filter:blur(8px)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
.top > *{pointer-events:auto}
.logo{display:flex;flex-direction:column;line-height:1;margin-right:6px}
.logo b{font-family:var(--disp);font-weight:700;font-size:24px;letter-spacing:2px}
.logo b i{font-style:normal;color:var(--amber)}
.logo span{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:3px}
.modes{display:flex;gap:4px;padding:4px;background:var(--glass);border:1px solid var(--line);clip-path:var(--cut)}
.mode{border:0;background:transparent;padding:8px 16px;font-family:var(--disp);font-weight:700;letter-spacing:1.5px;font-size:14px;color:var(--muted);cursor:pointer}
.mode[aria-selected="true"]{background:var(--amber);color:#1a1206}
.spacer{flex:1}
.launch{border:0;background:linear-gradient(180deg,var(--amber2),var(--amber));color:#1a1206;font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:2px;padding:12px 26px;clip-path:var(--cut);cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.launch small{font-family:var(--mono);font-size:10px;letter-spacing:1px;font-weight:700;opacity:.8}
.launch[aria-disabled="true"]{background:#3a3f46;color:#c9cfd6}
.plate{position:absolute;left:50%;top:76px;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:2}
.plate input{pointer-events:auto;background:transparent;border:0;border-bottom:1px dashed var(--line2);text-align:center;font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:3px;text-transform:uppercase;width:min(420px,80vw);padding:0 4px}
.plate input:focus{outline:none;border-bottom-color:var(--amber)}
.cls{display:inline-flex;gap:8px;align-items:center;margin-top:6px;font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--amber)}
.cls i{display:inline-block;width:8px;height:8px;background:var(--amber);transform:rotate(45deg)}
.rail{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:84px;display:flex;flex-direction:column;gap:6px;z-index:3}
.cat{display:grid;grid-template-columns:34px auto;align-items:center;gap:10px;min-width:168px;padding:7px 12px 7px 8px;border:1px solid var(--line);background:var(--glass);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);cursor:pointer;text-align:left;position:relative}
.cat svg{width:28px;height:28px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat b{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:1px;display:block;line-height:1.1}
.cat span{font-size:11px;color:var(--muted);display:block;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat:hover{border-color:var(--line2)}
.cat[aria-selected="true"]{border-color:var(--amber);background:rgba(242,165,65,.14)}
.cat[aria-selected="true"] svg{stroke:var(--amber)}
.cat .st{position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.cat .st.ok{background:var(--ok)}.cat .st.bad{background:var(--bad)}.cat .st.warn{background:var(--warn)}
.locker{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:84px;bottom:16px;width:380px;display:flex;flex-direction:column;z-index:3}
.locker .panel{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.lh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lh h2{font-family:var(--disp);font-size:24px;letter-spacing:1.5px;margin:0;text-transform:uppercase}
.ldesc{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:auto;min-height:0;padding-right:2px}
.pc{position:relative;border:1px solid var(--line);background:var(--glass2);padding:8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%);min-width:0}
.pc:hover{border-color:var(--line2)}
.pc[aria-pressed="true"]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber),inset 0 -40px 60px -40px rgba(242,165,65,.35)}
.pc .th{aspect-ratio:4/3;width:100%;background:radial-gradient(ellipse at 50% 60%,rgba(95,212,196,.14),transparent 70%);display:grid;place-items:center;overflow:hidden}
.pc .th img{width:100%;height:100%;object-fit:contain}
.pc .th em{font-style:normal;font-family:var(--disp);font-size:28px;color:var(--muted)}
.pc b{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.5px}
.pc span{font-family:var(--mono);font-size:10.5px;color:var(--muted);overflow-wrap:anywhere}
.pc .eq{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px;color:#1a1206;background:var(--amber);padding:1px 6px}
.spec{border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted);min-height:58px}
.spec b{color:var(--fg);font-family:var(--disp);font-size:14px;letter-spacing:.5px}
.spinbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spinbtns button{border:1px solid var(--line2);background:var(--glass2);padding:10px;font-family:var(--disp);font-weight:600;letter-spacing:1px;cursor:pointer;clip-path:var(--cut)}
.blue{display:flex;flex-wrap:wrap;gap:6px}
.blue button{border:1px solid var(--line2);background:transparent;padding:6px 10px;font-family:var(--mono);font-size:11px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;color:var(--muted)}
.blue button:hover{color:var(--fg);border-color:var(--amber)}
.dock{position:absolute;left:calc(max(16px,env(safe-area-inset-left,0px)) + 184px);right:calc(max(16px,env(safe-area-inset-right,0px)) + 392px);bottom:16px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px;z-index:3}
.dock .panel{padding:12px 14px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 78px;gap:10px;align-items:center}
.bar .k{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--muted)}
.bar .v{font-family:var(--disp);font-weight:600;font-size:16px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .v small{font-size:11px;font-family:var(--mono);margin-left:3px}
.track{position:relative;height:10px;background:rgba(255,255,255,.06);clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.track i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--teal),#9ef0e3);transition:width .35s}
.track u{position:absolute;top:0;bottom:0;text-decoration:none}
.track u.up{background:repeating-linear-gradient(45deg,var(--ok) 0 4px,rgba(107,217,154,.5) 4px 8px)}
.track u.down{background:repeating-linear-gradient(45deg,var(--bad) 0 4px,rgba(255,107,94,.5) 4px 8px)}
.track s{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);opacity:.5}
.dv{font-family:var(--mono);font-size:12px;font-weight:700}
.dv.up{color:var(--ok)}.dv.down{color:var(--bad)}
.sys h3{font-family:var(--disp);font-size:14px;letter-spacing:2px;margin:0 0 6px;display:flex;justify-content:space-between}
.syslist{display:flex;flex-direction:column;gap:5px;max-height:120px;overflow:auto;font-size:12.5px}
.sl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.tag{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 6px;letter-spacing:.5px;white-space:nowrap}
.tag.ok{background:rgba(107,217,154,.15);color:var(--ok)}.tag.warn{background:rgba(242,193,78,.15);color:var(--warn)}.tag.bad{background:rgba(255,107,94,.16);color:var(--bad)}
.chal{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chal span{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border:1px solid var(--line2);color:var(--muted)}
.chal span.done{border-color:var(--ok);color:var(--ok)}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:148px;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:1.5px;pointer-events:none;z-index:2;white-space:nowrap;opacity:.8}
.boot{position:absolute;inset:0;display:grid;place-items:center;z-index:30;background:var(--bg);font-family:var(--mono);letter-spacing:2px;color:var(--muted);text-align:center;padding:24px}
@media (max-width:1180px){.dock{grid-template-columns:minmax(0,1fr)}.dock .sys{display:none}}
@media (max-width:980px){
  body{overflow:auto}
  .app{height:auto;min-height:100%;overflow:visible;display:flex;flex-direction:column}
  .stage{position:relative;height:46vh;min-height:300px;flex:none}
  .top{position:relative;order:-1;flex-wrap:wrap;pointer-events:auto;background:var(--glass)}
  .launch{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .plate{top:10px}
  .plate input{font-size:22px}
  .hint{top:auto;bottom:8px}
  .rail{position:relative;left:auto;top:auto;flex-direction:row;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-left,0px));gap:6px;scrollbar-width:none}
  .cat{min-width:auto;grid-template-columns:24px auto;padding:6px 18px 6px 6px}
  .cat svg{width:22px;height:22px}
  .cat span{display:none}
  .locker{position:relative;right:auto;top:auto;bottom:auto;width:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));overflow:visible}
  .dock{position:relative;left:auto;right:auto;bottom:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px));grid-template-columns:minmax(0,1fr)}
  .dock .sys{display:block}
}
/* ---------- FLIGHT ---------- */
.fly{position:fixed;inset:0;background:#0d1b28;z-index:10}
.fly canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;pointer-events:none;font-family:var(--mono)}
.hud .panel{pointer-events:auto;padding:10px 12px}
.ftop{left:0;right:0;top:0;display:flex;gap:12px;align-items:flex-start;padding:12px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.ftop > *{pointer-events:auto}
.mission{max-width:400px}
.mission h2{font-family:var(--disp);font-size:20px;letter-spacing:1px;margin:0;text-transform:uppercase}
.mission p{margin:2px 0 0;font-family:var(--body);font-size:13px;color:var(--muted)}
.mission .goal{color:var(--fg);font-family:var(--body);font-size:14px;margin-top:6px}
.mission .timer{font-family:var(--disp);font-size:24px;color:var(--amber);font-weight:700;font-variant-numeric:tabular-nums}
.msel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msel button{border:1px solid var(--line2);background:transparent;padding:5px 10px;font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--muted)}
.msel button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.tele{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;width:200px}
.tele span{color:var(--muted)}
.tele b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.batt{grid-column:1/3;height:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:2px 0 4px}
.batt i{display:block;height:100%;background:var(--ok)}
.banner{left:50%;top:14px;transform:translateX(-50%);width:min(520px,calc(100% - 24px));text-align:center}
.banner div{background:rgba(9,18,28,.88);border:1px solid var(--amber);color:var(--amber);padding:8px 14px;font-size:13px;font-weight:700;margin-bottom:6px}
.banner div.bad{border-color:var(--bad);color:var(--bad)}.banner div.ok{border-color:var(--ok);color:var(--ok)}
.ctrl{right:max(12px,env(safe-area-inset-right,0px));bottom:14px;width:214px}
.ctrl .panel{display:flex;flex-direction:column;gap:6px}
.ctrl button{pointer-events:auto;border:1px solid var(--line2);background:rgba(22,40,58,.92);padding:7px 9px;font-family:var(--mono);font-size:12px;cursor:pointer;text-align:left}
.ctrl button:hover{border-color:var(--teal)}
.ctrl button.on{border-color:var(--bad);color:var(--bad)}
.ctrl label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.ctrl input[type=range]{width:100%;accent-color:var(--amber)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toggle-more{display:none}
.keys{left:max(12px,env(safe-area-inset-left,0px));bottom:14px;font-size:12px;color:var(--fg);max-width:min(560px,calc(100% - 260px));line-height:1.9}
.keys kbd{font-family:var(--mono);border:1px solid var(--line2);padding:0 5px;background:rgba(22,40,58,.92)}
.stick{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:150px;height:150px;border-radius:50%;background:rgba(9,18,28,.55);border:1px solid var(--line2);touch-action:none;pointer-events:auto}
.stick.left{left:max(18px,env(safe-area-inset-left,0px))}.stick.right{right:max(18px,env(safe-area-inset-right,0px))}
.stick i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(242,165,65,.85);box-shadow:0 0 0 6px rgba(242,165,65,.2)}
.stick span{position:absolute;left:0;right:0;top:-22px;text-align:center;font-size:11px;color:var(--muted)}
.result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,10,16,.6);padding:16px}
.result .panel{max-width:440px;width:100%;text-align:center;padding:24px;display:flex;flex-direction:column;gap:10px;font-family:var(--body)}
.result h2{font-family:var(--disp);font-size:28px;letter-spacing:2px;margin:0;text-transform:uppercase}
.result .big{font-family:var(--disp);font-size:48px;color:var(--amber);font-variant-numeric:tabular-nums}
.result .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--glass2);padding:10px 16px;font-family:var(--disp);font-weight:600;letter-spacing:1px;cursor:pointer;clip-path:var(--cut)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1206}
.flyinfo{font-size:11.5px;color:var(--muted);margin-top:8px}
@media (max-width:700px){
  .ftop{flex-direction:column;gap:8px}
  .mission{max-width:calc(100% - 170px)}.mission p,.flyinfo{display:none}.mission h2{font-size:16px}.mission .timer{font-size:18px}.mission .goal{font-size:12px}
  .teleWrap{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:60px}
  .tele{width:150px;font-size:11px;gap:1px 6px}.tele .ex{display:none}
  .ctrl{top:12px;bottom:auto;width:auto;max-width:calc(100% - 24px)}
  .ctrl .more{display:none}.ctrl.open .cg.more{display:grid}.ctrl.open label.more{display:flex}
  .toggle-more{display:block}
  .banner{top:auto;bottom:200px}
}
@media (prefers-reduced-motion: reduce){.track i{transition:none}}
</style>

</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage"><canvas id="hangar" aria-label="3D hangar with your drone on a turntable. Drag to look around."></canvas>
    <div class="plate"><input id="callsign" value="FALCON-01" maxlength="16" aria-label="Drone name"><br><span class="cls"><i></i><span id="cls">CINEMA CLASS</span></span></div>
    <div class="hint">DRAG TO ROTATE · SCROLL OR PINCH TO ZOOM</div>
  </div>
  <header class="top">
    <div class="logo"><b>DRONE<i>LAB</i></b><span>WORKSHOP · PART 1</span></div>
    <div class="modes" role="tablist"><button class="mode" id="mHangar" role="tab" aria-selected="true">HANGAR</button><button class="mode" id="mFlight" role="tab" aria-selected="false">FLIGHT</button></div>
    <div class="spacer"></div>
    <button class="launch" id="launch"><span>LAUNCH ▸</span><small id="launchSub">ALL SYSTEMS GO</small></button>
  </header>
  <nav class="rail" id="rail" aria-label="Part categories"></nav>
  <aside class="locker"><div class="panel" id="locker"></div></aside>
  <section class="dock">
    <div class="panel"><div class="bars" id="bars"></div></div>
    <div class="panel sys"><h3><span>SYSTEM CHECK</span><span id="sysCount" class="tag ok">READY</span></h3><div class="syslist" id="sys"></div><div class="chal" id="chal"></div></div>
  </section>
  <div class="boot" id="boot">LOADING HANGAR…</div>
</div>

<section class="fly" id="fly" hidden>
  <canvas id="simCanvas" aria-label="3D flight simulator"></canvas>
  <div class="hud ftop">
    <div class="panel mission">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><h2 id="mName">Free flight</h2><span class="timer" id="mTimer">0.0 s</span></div>
      <p id="mDesc"></p><div class="goal" id="mGoal"></div><div class="msel" id="msel"></div>
      <div class="flyinfo" id="flyingInfo"></div>
    </div>
    <div class="spacer"></div>
    <div class="teleWrap"><div class="panel"><div class="tele" id="tele"></div></div></div>
  </div>
  <div class="hud banner" id="banner"></div>
  <div class="hud ctrl" id="ctrl"><div class="panel">
    <button class="toggle-more" id="moreBtn">☰ CONTROLS</button>
    <div class="cg more"><button id="bTake">▲ Take off</button><button id="bLand">▼ Land</button><button id="bRtl">⌂ Return home</button><button id="bCam">◉ Camera</button><button id="bLink">Link loss</button><button id="bGps">GPS jam</button><button id="bMode">Mode: GPS</button><button id="bReset">↺ Reset</button></div>
    <label class="more">Wind <b id="windVal" style="color:var(--fg)">2 m/s</b><input type="range" id="wind" min="0" max="12" step="1" value="2"></label>
    <button id="bHangar">◂ Back to hangar</button>
  </div></div>
  <div class="hud keys panel" id="keys"><kbd>W</kbd>/<kbd>S</kbd> up/down · <kbd>A</kbd>/<kbd>D</kbd> turn · <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> move · <kbd>T</kbd> take off · <kbd>L</kbd> land · <kbd>H</kbd> home · <kbd>C</kbd> camera · <kbd>R</kbd> reset · game controller supported</div>
  <div class="stick left" id="stickL" hidden><span>CLIMB · TURN</span><i></i></div>
  <div class="stick right" id="stickR" hidden><span>MOVE</span><i></i></div>
  <div class="result" id="result" hidden><div class="panel" id="resultBox"></div></div>
</section>

<script>setTimeout(function(){if(!window.__DL_OK){var b=document.getElementById('boot');if(b)b.textContent='The 3D engine could not load. Check your internet connection and reload the page.';}},12000);</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>

    if (S.batt <= 10 && !S.ground && S.auto !== 'RTL' && S.auto !== 'LAND') { if (S.gps) { S.auto = 'RTL'; S.autoPhase = 0; msg('Critical battery: returning home', 'bad', 5); } else { S.auto = 'LAND'; msg('Critical battery: landing now', 'bad', 5); } }
    if (S.batt <= 0) { S.batt = 0; if (!S.ground) S.auto = 'LAND'; }
    if (S.ground) { S.spin = Math.max(0, S.spin - dt * .6); S.v.set(0, 0, 0); S.p.y = 0; S.pitch *= .8; S.roll *= .8; if (u.thr > .35 && S.batt > 2) { S.ground = false; S.auto = null; } if (S.auto === 'TAKEOFF') S.ground = false; return; }
    S.spin = Math.min(1, S.spin + dt * 2); S.yaw -= u.yaw * 1.7 * dt;
    const fwdV = V3(-Math.sin(S.yaw), 0, -Math.cos(S.yaw)), rightV = V3(Math.cos(S.yaw), 0, -Math.sin(S.yaw));
    let vt = fwdV.clone().multiplyScalar(u.fwd * vmax).add(rightV.clone().multiplyScalar(u.right * vmax)), vyT = u.thr > 0 ? u.thr * vup : u.thr * 2.5;
    if (S.auto === 'TAKEOFF') { vt.set(0, 0, 0); vyT = clamp((3 - S.p.y) * 1.4, -1, 2.2); if (Math.abs(S.p.y - 3) < .15) { S.auto = null; msg('Hovering at 3 m. Your turn!', 'ok', 2.5); } }
    else if (S.auto === 'LAND') { vt.set(0, 0, 0); vyT = S.p.y > 3 ? -1.8 : -.7; }
    else if (S.auto === 'RTL') { const flat = V3(-S.p.x, 0, -S.p.z), dist = flat.length(); if (S.autoPhase === 0) { vt.set(0, 0, 0); vyT = clamp((15 - S.p.y) * 1.2, -2, vup); if (S.p.y > 14 || dist < 3) S.autoPhase = 1; } if (S.autoPhase === 1) { vt = flat.normalize().multiplyScalar(Math.min(vmax * .7, dist * .9)); vyT = clamp(15 - S.p.y, -1, 1); const want = Math.atan2(S.p.x, S.p.z); let dy = ((want - S.yaw + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; S.yaw += clamp(dy, -1.2 * dt, 1.2 * dt); if (dist < .6) S.autoPhase = 2; } if (S.autoPhase === 2) { vt = V3(-S.p.x, 0, -S.p.z).multiplyScalar(1.2); vyT = S.p.y > 3 ? -1.8 : -.7; } }
    const vh = V3(S.v.x, 0, S.v.z); let acc;
    if ((S.gps && S.mode === 'GPS') || (S.auto && S.gps)) { acc = vt.clone().sub(vh).multiplyScalar(2.4); acc.add(wind.clone().sub(vh).multiplyScalar(.04)); }
    else { acc = fwdV.clone().multiplyScalar(u.fwd).add(rightV.clone().multiplyScalar(u.right)).multiplyScalar(aMax * .75).sub(vh.clone().sub(wind).multiplyScalar(.35)); if (S.auto) acc.add(vh.clone().multiplyScalar(-.2)); }
    if (acc.length() > aMax) acc.setLength(aMax);
    S.v.x += acc.x * dt; S.v.z += acc.z * dt; S.v.y += clamp((vyT - S.v.y) * 3, -g * .8, g * (twr - 1) * .8) * dt; S.p.addScaledVector(S.v, dt);
    const tp = clamp(-acc.dot(fwdV) / g, -.6, .6), trr = clamp(acc.dot(rightV) / g, -.6, .6); S.pitch += (tp - S.pitch) * Math.min(1, dt * 8); S.roll += (trr - S.roll) * Math.min(1, dt * 8);
    if (S.p.y <= 0) { const vs = -S.v.y; S.p.y = 0; if (vs > 3.2 || S.v.length() > 6) { crash(`hard landing at ${vs.toFixed(1)} m/s`); return; } S.ground = true; M.touch = vs; S.v.set(0, 0, 0); if (S.auto === 'LAND' || S.auto === 'RTL') msg('Landed. Motors disarmed.', 'ok', 2.5); S.auto = null; }
    for (const t of trees) if (S.p.y < t.h && Math.hypot(S.p.x - t.x, S.p.z - t.z) < t.r * (1 - S.p.y / t.h * .7) + .25) { crash('hit a tree'); return; }
    for (const b of boxes) if (S.p.y < b.h + .2 && Math.abs(S.p.x - b.x) < b.w / 2 + .25 && Math.abs(S.p.z - b.z) < b.d / 2 + .25) { crash('hit a building'); return; }
    if (S.p.y > 120) { S.p.y = 120; S.v.y = Math.min(0, S.v.y); msg('Altitude limit: 120 m (legal limit in many countries)', '', 3); }
    if (Math.hypot(S.p.x, S.p.z) > 220) { S.v.x *= -.3; S.v.z *= -.3; msg('Geofence: edge of the allowed area', 'bad', 3); }
  }
  const camPos = V3(0, 2, 4);
  function updateCamera(dt) {
    const p = S.p.clone().add(V3(0, params.foot, 0)), sz = params.size;
    if (camMode === 0) { const back = V3(Math.sin(S.yaw), 0, Math.cos(S.yaw)).multiplyScalar(.6 + sz * 2.4); const want = p.clone().add(back).add(V3(0, .25 + sz * .9, 0)); camPos.lerp(want, Math.min(1, dt * 4)); camPos.y = Math.max(.25, camPos.y); camera.position.copy(camPos); camera.lookAt(p.x, p.y + .05, p.z); camera.fov = 55; }
    else if (camMode === 1) { camera.position.set(-3, 1.7, 6); camera.lookAt(p); camera.fov = clamp(60 - S.p.distanceTo(camera.position) * .6, 14, 60); }
    else if (camMode === 2) { const f = V3(-Math.sin(S.yaw), -.18, -Math.cos(S.yaw)); camera.position.copy(p).addScaledVector(f, sz * .55); camera.lookAt(camera.position.clone().add(f)); camera.rotateZ(-S.roll * .6); camera.fov = 75; }
    else { camera.position.set(p.x, p.y + 35, p.z + .01); camera.lookAt(p); camera.fov = 50; }
    camera.updateProjectionMatrix(); D.root.visible = camMode !== 2;
  }
  let hudT = 0;
  function hud() {
    const spd = Math.hypot(S.v.x, S.v.z), home = Math.hypot(S.p.x, S.p.z), mode = S.crashed ? 'CRASHED' : S.ground ? 'LANDED' : S.auto ? (S.auto === 'RTL' ? 'RETURN HOME' : S.auto) : S.mode === 'GPS' ? 'POSITION' : 'ATTI', bc = S.batt > 30 ? 'var(--ok)' : S.batt > 15 ? 'var(--warn)' : 'var(--bad)';
    $('#tele').innerHTML = `<span>MODE</span><b style="color:${S.crashed ? 'var(--bad)' : S.auto ? 'var(--amber)' : 'var(--teal)'}">${mode}</b><span>ALT</span><b>${S.p.y.toFixed(1)} m</b><span>SPEED</span><b>${spd.toFixed(1)} m/s</b><span class="ex">CLIMB</span><b class="ex">${S.v.y >= 0 ? '+' : ''}${S.v.y.toFixed(1)} m/s</b><span class="ex">HOME</span><b class="ex">${home.toFixed(0)} m</b><span>GPS</span><b style="color:${S.gps ? 'var(--ok)' : 'var(--bad)'}">${S.gps ? '14 SATS' : params.gps ? 'JAMMED' : 'NONE'}</b><span>LINK</span><b style="color:${S.link ? 'var(--ok)' : 'var(--bad)'}">${S.link ? 'OK' : 'LOST'}</b><span class="ex">WIND</span><b class="ex">${wind.length().toFixed(1)} m/s</b><span>BATTERY</span><b style="color:${bc}">${Math.max(0, S.batt).toFixed(0)}%</b><div class="batt"><i style="width:${clamp(S.batt, 0, 100)}%;background:${bc}"></i></div>`;
    $('#banner').innerHTML = ''; S.msgs.slice(-3).forEach(m => { const d = document.createElement('div'); if (m.cls) d.className = m.cls; d.textContent = m.text; $('#banner').appendChild(d); });
    $('#mTimer').textContent = M.t.toFixed(1) + ' s'; $('#bMode').textContent = 'Mode: ' + (S.mode === 'GPS' ? 'GPS' : 'ATTI'); $('#bCam').textContent = '◉ ' + CAMS[camMode];
  }
  function resize() { const r = canvas.getBoundingClientRect(); if (!r.width) return; renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(canvas);
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (!$('#fly').hidden && params && !document.hidden) {
      acc += dt; const h = 1 / 120; while (acc >= h) { step(h); updateMission(h); acc -= h; }
      D.root.position.set(S.p.x, S.p.y + params.foot, S.p.z); D.root.rotation.set(S.pitch, S.yaw, -S.roll, 'YXZ'); D.spin(dt, S.spin);
      ringMeshes.forEach((r, i) => { if (i === M.next) r.m.rotation.z += dt * .8; }); beacon.material.opacity = .18 + .1 * Math.sin(now / 300);
      sun.position.set(S.p.x - 20, 40, S.p.z + 14); sun.target.position.copy(S.p);
      updateCamera(dt); hudT += dt; if (hudT > .08) { hudT = 0; hud(); }
      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame); resize();
  return { loadDrone, resize };
}

/* =================== MODES =================== */
function show(view) {
  const fly = view === 'fly';
  $('#fly').hidden = !fly;
  $('#mHangar').setAttribute('aria-selected', String(!fly)); $('#mFlight').setAttribute('aria-selected', String(fly));
  if (fly) {
    if (!sim) sim = initSim();
    const st = compute(cfg), name = ($('#callsign').value || 'DRONE').toUpperCase();
    sim.loadDrone(st.ok ? cfg : BLUEPRINTS.cinema, st.ok ? name : 'FALCON-01 (sample: your build still has problems)');
    requestAnimationFrame(() => sim.resize());
  }
  try { if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view); } catch (e) {}
}
$('#mHangar').addEventListener('click', () => show('hangar'));
$('#mFlight').addEventListener('click', () => show('fly'));
$('#bHangar').addEventListener('click', () => show('hangar'));
$('#launch').addEventListener('click', () => { const s = compute(cfg); if (!s.ok) { const firstBad = s.checks.find(c => c.lvl === 'bad'); if (firstBad) selectCat(firstBad.cat); return; } show('fly'); });
$('#callsign').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); });
addEventListener('hashchange', () => show(location.hash === '#fly' ? 'fly' : 'hangar'));

try { H = initHangar(); H.setDrone(cfg, null); } catch (e) { console.error(e); }
renderAll();
show(location.hash === '#fly' ? 'fly' : 'hangar');
window.__DL_OK = true; $('#boot').remove();
</script>
